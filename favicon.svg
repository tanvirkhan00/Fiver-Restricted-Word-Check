<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>

    <!-- Emerald Brand Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F293"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F293"/>
    </linearGradient>

    <!-- Glass Fill -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131D33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squiricle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient Ambient Behind Shield -->
  <circle cx="256" cy="240" r="160" fill="#00F293" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Cyber Shield Contour with Glow -->
  <path d="M256 56 L398 108 C398 238 344 382 256 454 C168 382 114 238 114 108 Z"
        fill="url(#emeraldGrad)" filter="url(#subtleGlow)"/>

  <!-- Dark Tech Shield Core -->
  <path d="M256 74 L380 120 C380 232 334 354 256 422 C178 354 132 232 132 120 Z"
        fill="url(#glassGrad)"/>

  <!-- Futuristic Inner Rim Highlight -->
  <path d="M256 86 L368 128 C368 226 326 336 256 398 C186 336 144 226 144 128 Z"
        fill="none" stroke="rgba(0, 242, 147, 0.22)" stroke-width="3"/>

  <!-- Aerodynamic Chat Bubble Body -->
  <path d="M184 178 C184 148 208 124 238 124 H318 C348 124 372 148 372 178 V232 C372 262 348 286 318 286 H250 L204 322 C196 328 184 322 184 312 V286 C184 286 184 178 178 178 Z"
        fill="#070B13" stroke="rgba(0, 242, 147, 0.35)" stroke-width="4"/>

  <!-- Sleek Glowing Security Checkmark Emblem -->
  <path d="M228 214 L264 250 L338 172"
        fill="none" stroke="url(#emeraldGrad)" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Top-Right Active Security Node Pulse -->
  <circle cx="376" cy="120" r="14" fill="#00F293" filter="url(#subtleGlow)"/>
  <circle cx="376" cy="120" r="7" fill="#FFFFFF"/>

  <!-- Bottom Cyber Safety Radar Dots -->
  <circle cx="256" cy="376" r="6" fill="#00F293"/>
  <circle cx="230" cy="368" r="4" fill="#10B981" opacity="0.8"/>
  <circle cx="282" cy="368" r="4" fill="#10B981" opacity="0.8"/>
</svg>
