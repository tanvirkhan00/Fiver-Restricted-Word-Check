<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Fiverr Message Safety Checker</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      html, body { margin: 0; padding: 0; background: #080b12; height: 100%; }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #080b12;
        background-image:
          radial-gradient(ellipse 80% 60% at 10% 0%, rgba(79,158,255,0.08) 0%, transparent 60%),
          radial-gradient(ellipse 60% 50% at 90% 100%, rgba(255,77,109,0.05) 0%, transparent 60%);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #preloader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .pl-ring-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        margin-bottom: 24px;
      }
      .pl-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0%, #4f9eff 30%, transparent 55%);
        animation: pl-spin 1.15s linear infinite;
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      }
      .pl-ring-2 {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: conic-gradient(from 180deg, transparent 0%, rgba(255,77,109,0.55) 25%, transparent 45%);
        animation: pl-spin-rev 1.6s linear infinite;
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      }
      .pl-core {
        position: absolute;
        inset: 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #1a2550, #0e1a3a);
        border: 1px solid #2a3260;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 32px rgba(79,158,255,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
        animation: pl-pulse 2s ease-in-out infinite;
      }
      .pl-core svg { width: 26px; height: 26px; display: block; }

      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @keyframes pl-spin-rev { to { transform: rotate(-360deg); } }
      @keyframes pl-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 32px rgba(79,158,255,0.28), inset 0 1px 0 rgba(255,255,255,0.06); }
        50% { transform: scale(1.06); box-shadow: 0 0 44px rgba(79,158,255,0.4), inset 0 1px 0 rgba(255,255,255,0.08); }
      }

      .pl-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #e2e8ff;
        letter-spacing: 0.3px;
        margin-bottom: 7px;
        opacity: 0;
        animation: pl-fade-in 0.6s ease 0.15s forwards;
      }
      .pl-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: #5a6590;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0;
        animation: pl-fade-in 0.6s ease 0.35s forwards;
      }
      @keyframes pl-fade-in { to { opacity: 1; } }

      .pl-welcome {
        margin-top: 14px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 13px;
        color: #9fb4ff;
        opacity: 0;
        display: none;
        transition: opacity 0.4s ease;
      }
      .pl-welcome.show {
        display: block;
        opacity: 1;
      }

      .pl-dots { display: inline-flex; gap: 3px; }
      .pl-dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #4f9eff;
        animation: pl-dot 1.2s ease-in-out infinite;
      }
      .pl-dots span:nth-child(2) { animation-delay: 0.15s; }
      .pl-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pl-dot {
        0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div class="pl-ring-wrap">
        <div class="pl-ring"></div>
        <div class="pl-ring-2"></div>
        <div class="pl-core">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4f9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 L4 5 V11 C4 16.5 7.5 20.5 12 22 C16.5 20.5 20 16.5 20 11 V5 Z" />
          </svg>
        </div>
      </div>
      <div class="pl-title">Fiverr Safety Checker</div>
      <div class="pl-subtitle">
        <span>Loading your workspace</span>
        <span class="pl-dots"><span></span><span></span><span></span></span>
      </div>
      <div class="pl-welcome" id="pl-welcome"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

</html>
